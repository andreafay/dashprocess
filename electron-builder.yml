appId: com.hpdashboard.app
productName: Hiring Dashboard
directories:
  buildResources: build
files:
  - out/**
  - resources/**
  - package.json
asar: true
# The window icon is read from resources/ at runtime, so keep it outside the archive.
asarUnpack:
  - resources/**
win:
  executableName: hiring-dashboard
  icon: resources/icon.ico
  target: nsis
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
